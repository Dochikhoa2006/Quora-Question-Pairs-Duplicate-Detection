[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quora-duplicate-detection"
version = "2.0.0"
description = "Reproducible lexical and semantic duplicate-question detection."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "CC-BY-4.0"
license-files = ["LICENSE"]
authors = [
  { name = "Chi Khoa Do", email = "dochikhoa2006@gmail.com" },
]
keywords = [
  "duplicate-question-detection",
  "natural-language-processing",
  "sentence-transformers",
  "probability-calibration",
  "reproducible-machine-learning",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy==2.4.4",
  "pandas==2.3.3",
  "scikit-learn==1.8.0",
  "scipy==1.17.1",
]

[project.urls]
Homepage = "https://github.com/Dochikhoa2006/Quora-Question-Pairs-Duplicate-Detection"
Documentation = "https://github.com/Dochikhoa2006/Quora-Question-Pairs-Duplicate-Detection/tree/main/docs"
Issues = "https://github.com/Dochikhoa2006/Quora-Question-Pairs-Duplicate-Detection/issues"
Changelog = "https://github.com/Dochikhoa2006/Quora-Question-Pairs-Duplicate-Detection/blob/main/CHANGELOG.md"

[project.optional-dependencies]
semantic = [
  "accelerate==1.12.0",
  "datasets==4.8.4",
  "peft==0.18.1",
  "sentence-transformers==5.4.0",
  "torch==2.13.0",
]
dev = [
  "bandit==1.9.4",
  "pip-audit==2.9.0",
  "pytest==9.0.2",
  "pytest-cov==7.0.0",
  "ruff==0.15.4",
]

[project.scripts]
qqdup = "quora_duplicate_detection.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["quora_duplicate_detection"]
omit = [
  "*/__main__.py",
  "*/semantic.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
