name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements-dev.txt
          python -m pip install --no-deps --editable .
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest --cov=quora_duplicate_detection --cov-report=term-missing

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Verify wheel contents
        run: |
          python -m zipfile --list dist/*.whl
          python -m venv /tmp/qqdup-wheel-check
          /tmp/qqdup-wheel-check/bin/python -m pip install dist/*.whl
          /tmp/qqdup-wheel-check/bin/qqdup --help
      - uses: actions/upload-artifact@v4
        with:
          name: quora-duplicate-detection-wheel
          path: dist/*.whl
          if-no-files-found: error

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build and smoke test
        run: |
          docker build --tag quora-duplicate-detection:test .
          docker run --rm quora-duplicate-detection:test --help
