name: Feature request
description: Propose a scoped improvement with a measurable benefit.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or research problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe behavior, interfaces, and likely files affected.
    validations:
      required: true
  - type: textarea
    id: evaluation
    attributes:
      label: Validation plan
      description: How will correctness and, when applicable, model quality be measured?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and tradeoffs
      description: What simpler options were considered?
  - type: checkboxes
    id: scope
    attributes:
      label: Scope checks
      options:
        - label: The proposal does not require hidden competition labels.
          required: true
        - label: The proposal can avoid committing private data or generated checkpoints.
          required: true
