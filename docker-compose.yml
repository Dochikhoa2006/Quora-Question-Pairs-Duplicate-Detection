services:
  qqdup:
    build:
      context: .
    image: quora-duplicate-detection:local
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=256m,mode=1777
    volumes:
      - ./data:/data:ro
      - ./artifacts:/artifacts
      - ./outputs:/outputs
    command:
      - --help
